# Known-failure playbook for the quest family (executor + batch sweep).
#
# Each rule matches log lines by regex and assigns one of four classes:
#   ignore  - a known false failure; if every error line in a log is covered by
#             ignore rules, the run counts as a success.
#   retry   - transient; re-run the same thing without spending a retry.
#   hint    - a known cause with a known fix; the hint is handed to the retry.
#   blocker - needs a human (e.g. an editor setting); retrying cannot help.
#
# `requires` makes a rule apply only when another rule also matched the same
# log (for summary lines that are only harmless as a consequence).
# Add a rule the first time a failure bites; one rule per root cause.

rules:
  - id: engine-dll-locked-by-editor
    class: ignore
    patterns:
      - "UbaSessionServer - ERROR opening file .*\\\\Engine\\\\Binaries\\\\Win64\\\\UnrealEditor-\\w+\\.dll for write"
      - "Link \\[x64\\] UnrealEditor-NetCore\\.dll: Exited with error code"
      - "LNK1104: cannot open file '\\.\\.\\\\Binaries\\\\Win64\\\\UnrealEditor-NetCore\\.dll'"
    note: >-
      The open DebugGame editor holds engine DLLs (NetCore) that a headless
      Build.bat also relinks. Project modules still build; judge the build by
      the project DLL timestamp, not the overall result line.

  - id: build-summary-after-engine-lock
    class: ignore
    requires: engine-dll-locked-by-editor
    patterns:
      - "Result: Failed \\(OtherCompilationError\\)"
    note: The overall build result is failed only because of the engine DLL lock.

  - id: editor-search-db-locked
    class: ignore
    patterns:
      - "LogFileInfo: Error: Failed to open database for '.*Saved/Search'"
    note: The open editor owns the asset search database; a headless test editor logs this and carries on.

  - id: http-port-taken
    class: ignore
    patterns:
      - "LogHttpListener: Error: HttpListener unable to bind to 127\\.0\\.0\\.1:\\d+"
    note: The open editor's MCP server already holds the port; tests do not use it.

  - id: engine-error-selftest
    class: ignore
    patterns:
      - "LogTemp: Error (test|with param|with context): UE::UnifiedErrorTest"
    note: Engine self-test output that prints the word Error on success.

  - id: live-coding-active
    class: blocker
    patterns:
      - "Unable to build while Live Coding is active"
    note: >-
      Live Coding blocks Build.bat. Disable Live Coding in the open editor
      (Editor Preferences > Live Coding) or close the editor, then re-run.

  - id: conflicting-ubt
    class: retry
    patterns:
      - "A conflicting instance of UnrealBuildTool is already running"
      - "Waiting for .*UnrealBuildTool.* to finish"
    note: Another build is running; wait and retry.

  - id: project-file-in-use
    class: retry
    patterns:
      - "being used by another process"
    note: A transient file lock (indexer, antivirus, a finishing build); retry after a short wait.

  - id: p4-read-only
    class: hint
    patterns:
      - "Access to the path .* is denied"
      - "because it is read-only"
      - "Permission denied: .*\\.(h|cpp|cs|ini|uasset|umap|py|md|yaml)"
    note: >-
      The file is Perforce read-only. Clear the read-only flag on exactly the
      files the step writes (attrib -r); the executor's scoped reconcile opens
      them for edit afterwards. Never p4 edit or p4 revert.

  - id: model-api-transient
    class: retry
    patterns:
      - "API Error: 5\\d\\d"
      - "overloaded_error"
      - "rate_limit_error"
      - "Request timed out"
      - "ECONNRESET"
    note: The model API failed transiently; re-dispatch.

# Executor failure_type values (complete.yaml / lessons.yaml) that are infra,
# not code: the batch sweep re-dispatches a campaign whose only failures are these.
infra_failure_types:
  - timeout
  - malformed_output
  - verify_malformed
